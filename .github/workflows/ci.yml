# Build DynaLM on every supported CPU platform.
#
#   build      : configure, build, CPU feature validation (doctor runs the
#                DynaCore kernel self-test), then the model-free test programs
#                and tool tests (tools/ci/run_tests.sh).
#   sanitizers : the same tests under ASan+UBSan and TSan (Linux, clang).
#   package    : release-style static build -> archive -> fresh install through
#                scripts/install.sh / install.ps1 -> checks on the INSTALLED
#                binaries (tools/ci/package.sh).
name: ci

on:
  push:
    branches: [main, master, "ci/**", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: DynaCore boundary (core-only build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # DynaCore alone: the dynalm/ tree is not configured, so any dependency
      # on it fails to compile.
      - run: cmake --preset core-only
      - run: cmake --build --preset core-only
      - name: Model-free DynaCore tests
        run: bash tools/ci/run_tests.sh build/core-only

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64 (gcc), os: ubuntu-24.04, preset: linux-release }
          - { name: linux-x86_64 (clang), os: ubuntu-24.04, preset: linux-clang-release }
          - { name: linux-arm64 (NEON), os: ubuntu-24.04-arm, preset: linux-release }
          - { name: macos-arm64 (Apple Silicon, NEON), os: macos-14, preset: macos-release }
          # Intel macOS build, run under Rosetta 2 on Apple Silicon: no native
          # AVX2 there, so it exercises the runtime fallback to generic kernels.
          - { name: macos-x86_64 (Rosetta, generic fallback), os: macos-14, preset: macos-release, cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64 }
          - { name: windows-x86_64 (MSVC), os: windows-2022, preset: msvc-release }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.cmake_args }}
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}
      - name: CPU feature validation
        shell: bash
        run: |
          exe="build/${{ matrix.preset }}/bin/dynalm"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" doctor
          PY="$(command -v python3 || command -v python)"
          "$PY" tools/ci/check_isa.py "$exe"
      - name: Model-free tests
        shell: bash
        run: bash tools/ci/run_tests.sh build/${{ matrix.preset }}

  sanitizers:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan-ubsan, linux-tsan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Allow TSAN on recent kernels
        if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Instrumented self-test
        run: |
          build/${{ matrix.preset }}/bin/dynalm --version
          build/${{ matrix.preset }}/bin/dynalm doctor
      - name: Model-free tests (instrumented)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: bash tools/ci/run_tests.sh build/${{ matrix.preset }}

  package:
    name: package + fresh install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - shell: bash
        run: bash tools/ci/package.sh

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dynalm .
      - run: docker run --rm dynalm --version
      - run: docker run --rm dynalm doctor
