# Release: push a tag like v0.2.0 (stable) or v0.2.0-beta.1 (pre-release).
# The tag must equal "v" + the source version (CMakeLists.txt: project VERSION
# + DYNALM_VERSION_SUFFIX; tools/ci/version.py), and every installed binary
# must report it (tools/ci/package.sh). The release is created as a DRAFT,
# only when every package job passed, with the notes in
# .github/release-notes/<tag>.md (required); a maintainer reviews the draft and
# its assets, then publishes it. A tag with a pre-release suffix is marked
# pre-release and never becomes the Latest release; its assets leave out the
# experimental Vulkan builds; the Docker image job runs for stable tags only.
#
# Every platform job builds and runs the full test suite, then builds the
# self-contained release archive (static C/C++ runtime), installs it into an
# empty prefix with the user-facing installer and runs the smoke tests on the
# installed binaries (tools/ci/package.sh). Only archives whose job passed are
# uploaded; the publish job attaches them and a SHA256SUMS file to a GitHub
# release named after the tag.
#
# Assets: dynalm-linux-x86_64.tar.gz, dynalm-linux-arm64.tar.gz,
#         dynalm-macos-arm64.tar.gz, dynalm-macos-x86_64.tar.gz,
#         dynalm-windows-x86_64.zip, dynalm-windows-arm64.zip,
#         GPU variants dynalm-linux-x86_64-vulkan.tar.gz and
#         dynalm-windows-x86_64-vulkan.zip, SHA256SUMS. The macOS arm64
#         archive includes Metal.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 (glibc 2.35) with GCC 13 from the toolchain
          # PPA, so the binary also runs on older distributions than the
          # 24.04 CI image; libstdc++/libgcc are linked statically.
          - { name: linux-x86_64, os: ubuntu-22.04, preset: linux-release, gcc13: true }
          - { name: linux-arm64, os: ubuntu-22.04-arm, preset: linux-release, gcc13: true }
          # Every Apple Silicon package includes Metal (GPU first; it falls back
          # to the CPU on its own when a GPU cannot run a model).
          - { name: macos-arm64, os: macos-14, preset: macos-release, cmake_args: -DENABLE_METAL=ON }
          # Vulkan GPU builds next to the CPU builds; the installers choose.
          - { name: linux-x86_64-vulkan, os: ubuntu-22.04, preset: linux-release, gcc13: true, vulkan: true, cmake_args: -DENABLE_VULKAN=ON }
          - { name: windows-x86_64-vulkan, os: windows-2022, preset: msvc-release, vulkan: true, cmake_args: -DENABLE_VULKAN=ON }
          # Intel build on Apple Silicon; tests run under Rosetta 2.
          - { name: macos-x86_64, os: macos-14, preset: macos-release, cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64 }
          - { name: windows-x86_64, os: windows-2022, preset: msvc-release }
          # Windows on ARM (Snapdragon class), native ARM64 build.
          - { name: windows-arm64, os: windows-11-arm, preset: msvc-release, msvc_arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Linux, GCC 13)
        if: matrix.gcc13
        # The PPA is an external service that sometimes returns 503: retry with
        # backoff so a short outage does not drop the Linux archives from a release.
        # While the PPA is down apt reads "g++-13" as a pattern and installs clang-13
        # packages instead, so success means the compiler is actually there.
        run: |
          for attempt in 1 2 3 4 5; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test &&
              sudo apt-get update &&
              sudo apt-get install -y -o Acquire::Retries=5 g++-13 ninja-build &&
              command -v g++-13 && break
            [ "$attempt" = 5 ] && { echo "GCC 13 toolchain install failed after 5 attempts"; exit 1; }
            echo "toolchain install failed (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: brew install ninja
      - name: Vulkan SDK
        if: matrix.vulkan
        shell: bash
        run: bash tools/ci/setup_vulkan_sdk.sh
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}
      - name: Source version (a tag must match it)
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then "$PY" tools/ci/version.py --check-tag "$GITHUB_REF_NAME"; else "$PY" tools/ci/version.py; fi
      - name: Build
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} ${{ matrix.cmake_args }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Package and validate a fresh install
        shell: bash
        run: |
          # Tag builds: the installed binary must report the tag's version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export DYNALM_EXPECT_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash tools/ci/package.sh ${{ matrix.cmake_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: dynalm-${{ matrix.name }}
          path: dist/dynalm-*
          if-no-files-found: error

  publish:
    needs: package
    # Only when every package job passed (a failed platform stops the release; nothing
    # incomplete is published), and only for tags. The release is a draft until reviewed.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # signed build provenance (Sigstore), below
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Release kind and notes
        id: kind
        run: |
          python3 tools/ci/version.py --check-tag "$GITHUB_REF_NAME"
          pre="$(python3 tools/ci/version.py --prerelease)"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$pre" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -s "$notes" ] || { echo "missing release notes: $notes"; exit 1; }
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Platform archives only (dynalm-linux-*, dynalm-macos-*, dynalm-windows-*): the
          # docker job's build record artifact does not extract and failed the download.
          pattern: dynalm-[lmw]*
          merge-multiple: true
      - name: Expected assets
        run: |
          cd dist
          # Pre-releases leave out the experimental Vulkan builds (built and tested above).
          if [ "${{ steps.kind.outputs.prerelease }}" = true ]; then rm -f dynalm-*-vulkan.*; fi
          want="dynalm-macos-arm64.tar.gz dynalm-macos-x86_64.tar.gz dynalm-linux-x86_64.tar.gz dynalm-linux-arm64.tar.gz dynalm-windows-x86_64.zip dynalm-windows-arm64.zip"
          [ "${{ steps.kind.outputs.prerelease }}" = true ] || want="$want dynalm-linux-x86_64-vulkan.tar.gz dynalm-windows-x86_64-vulkan.zip"
          for f in $want; do [ -s "$f" ] || { echo "missing release asset: $f"; exit 1; }; done
          ls -l
      - name: SHA256SUMS
        run: |
          cd dist
          ls dynalm-*.tar.gz dynalm-*.zip 2>/dev/null || { echo "no archive passed its tests"; exit 1; }
          sha256sum dynalm-*.tar.gz dynalm-*.zip 2>/dev/null > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
      # Signed provenance for every archive: `gh attestation verify <file> --repo <owner>/dynalm`
      # proves it was built by this workflow from this repository (SECURITY.md).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/dynalm-*.tar.gz
            dist/dynalm-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          name: DynaLM ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          make_latest: ${{ steps.kind.outputs.latest }}
          body_path: ${{ steps.kind.outputs.notes }}
          files: |
            dist/dynalm-*
            dist/SHA256SUMS
          generate_release_notes: true

  # CPU server image (amd64 + arm64): ghcr.io/<owner>/dynalm:cpu and :<tag>-cpu.
  # Stable tags only: a pre-release (v*-beta.N, -rc.N, ...) must never replace the :cpu image.
  docker:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Build provenance and an SBOM (software bill of materials) attached to the image.
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dynalm:cpu
            ghcr.io/${{ github.repository_owner }}/dynalm:${{ github.ref_name }}-cpu
