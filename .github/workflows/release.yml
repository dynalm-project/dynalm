# Release packages: push a tag like v0.1.0 to build self-contained archives
# (static C/C++ runtime) for every platform and attach them to a GitHub release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=OFF -DENABLE_BENCHMARKS=OFF -DDYNALM_STATIC_RUNTIME=ON
          ${{ runner.os == 'Windows' && '-DCMAKE_CXX_COMPILER=cl' || '' }}
      - run: cmake --build build/package
      - name: Package
        working-directory: build/package
        run: cpack
      - uses: actions/upload-artifact@v4
        with:
          name: dynalm-${{ matrix.name }}
          path: |
            build/package/dynalm-*.zip
            build/package/dynalm-*.tar.gz

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum dynalm-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # CPU server image (amd64 + arm64): ghcr.io/<owner>/dynalm:cpu and :<tag>-cpu.
  # A CUDA image follows the CUDA device (docs/compiler-backends.md); none is
  # published before it exists.
  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dynalm:cpu
            ghcr.io/${{ github.repository_owner }}/dynalm:${{ github.ref_name }}-cpu
